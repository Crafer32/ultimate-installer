# Debian Ultimate: answers the boring questions so the normal install is short.
# Only used by the "Install" entry; "Expert install" still asks everything.

# No domain. Root: the "same password for root" checkbox (ultimate-rootpw)
# turns this on when unticked, so user-setup asks the root password too.
d-i netcfg/get_domain string
d-i passwd/root-login boolean false

# Writing the partitions: still asked, but with "Yes" already selected
# (value preseeded, "seen" flag cleared so the question is shown).
d-i partman/confirm boolean true
d-i partman/confirm seen false
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm_nooverwrite seen false
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm seen false

# console-data (in Devuan's base) asks again for the console keymap: keep
# the one the installer already configured.
d-i console-data/keymap/policy select Don't touch keymap

# Mirror: Devuan by default (the systemd choice switches it to Debian).
d-i mirror/country string manual
d-i mirror/http/hostname string deb.devuan.org
d-i mirror/http/directory string /merged
d-i mirror/http/proxy string

# Do not ask to scan more discs, nor to send package statistics.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i popularity-contest/participate boolean false
